[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raymc"
version = "0.1.0.dev0"
description = "RAY-MC: (hybrid) reverse Monte Carlo for atomic-scale structural resolution"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.8,<2.14",
    "nvalchemi-toolkit>=0.1.0",
    "ase>=3.23",
    "periodictable==2.0.2",
    "numpy<2.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
metatomic = ["metatomic-torch", "vesin"]
upet = ["upet"]
plot = ["matplotlib"]

[project.scripts]
raymc = "raymc.cli:main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes, isort

[tool.hatch.build.targets.wheel]
packages = ["src/raymc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
